name: ModLEX App release
on:
  workflow_run:
    workflows: ['ModLEX App build']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release:
    name: Release ModLEX App
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: windows-latest
    env:
      VERSION_TAG: ${{ github.event.workflow_run.head_branch }}
      WINDOWS_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-pc-windows-msvc)

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify ref is a tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha=$(gh api "repos/${{ github.repository }}/git/refs/tags/${VERSION_TAG}" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$tag_sha" ]; then
            echo "::error::${VERSION_TAG} is not a git tag in this repo"
            exit 1
          fi
          if [ "$tag_sha" != "$HEAD_SHA" ]; then
            commit_sha=$(gh api "repos/${{ github.repository }}/git/tags/${tag_sha}" --jq '.object.sha' 2>/dev/null || echo "$tag_sha")
            if [ "$commit_sha" != "$HEAD_SHA" ]; then
              echo "::error::Tag ${VERSION_TAG} (${commit_sha}) does not match build head_sha (${HEAD_SHA})"
              exit 1
            fi
          fi
          echo "Verified ${VERSION_TAG} is a tag pointing at ${HEAD_SHA}"

      # Beta channel: any tag with a "-beta" prerelease suffix, e.g. v1.4.0-beta.1
      - name: Determine update channel
        shell: bash
        run: |
          if [[ "$VERSION_TAG" == *-beta* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
            echo "MANIFEST_FILE=updates-beta.json" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
            echo "MANIFEST_FILE=updates.json" >> "$GITHUB_ENV"
          fi

      - name: Download ModLEX App artifacts
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: theseus-build.yml
          workflow_conclusion: success
          event: push
          branch: ${{ env.VERSION_TAG }}
          use_unzip: true

      - name: Extract app changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION_TAG }}
        run: |
          LAST_GITHUB_RELEASE_PUBLISHED_AT=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.published_at // ""' 2>/dev/null || true)
          LAST_GITHUB_RELEASE_PUBLISHED_AT="$LAST_GITHUB_RELEASE_PUBLISHED_AT" npx --yes tsx scripts/build-theseus-release-notes.ts

      # actions/upload-artifact strips whatever common ancestor directory the
      # uploaded glob paths shared, so the exact nesting inside the downloaded
      # artifact folder isn't guaranteed — find the files by name instead of
      # assuming a fixed path.
      - name: Locate build artifacts
        shell: bash
        run: |
          VERSION="${VERSION_TAG#v}"
          SETUP_EXE=$(find "$WINDOWS_X64_BUNDLE_ARTIFACT_NAME" -iname '*-setup.exe' | head -n1)
          SETUP_ZIP=$(find "$WINDOWS_X64_BUNDLE_ARTIFACT_NAME" -iname '*-setup.nsis.zip' | head -n1)
          SETUP_SIG=$(find "$WINDOWS_X64_BUNDLE_ARTIFACT_NAME" -iname '*-setup.nsis.zip.sig' | head -n1)
          if [ -z "$SETUP_EXE" ] || [ -z "$SETUP_ZIP" ] || [ -z "$SETUP_SIG" ]; then
            echo "::error::Could not find one or more Windows build artifacts"
            find "$WINDOWS_X64_BUNDLE_ARTIFACT_NAME"
            exit 1
          fi
          echo "SETUP_EXE=$SETUP_EXE" >> "$GITHUB_ENV"
          echo "SETUP_ZIP=$SETUP_ZIP" >> "$GITHUB_ENV"
          echo "SETUP_SIG=$SETUP_SIG" >> "$GITHUB_ENV"

      - name: Generate version manifest
        shell: bash
        run: |
          # Reference: https://tauri.app/plugin/updater/#server-support
          VERSION="${VERSION_TAG#v}"
          SIG=$(cat "$SETUP_SIG")
          jq -nc \
            --arg version "$VERSION" \
            --arg signature "$SIG" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/ModLEX.App_${VERSION}_x64-setup.nsis.zip" \
            --arg modrinthBase "0.18.2" \
            --rawfile releaseNotes release-notes.md \
          '{
            "version": $version,
            "notes": $releaseNotes,
            "pub_date": now | todateiso8601,
            "modrinth_base": $modrinthBase,
            "platforms": {
              "windows-x86_64": {
                "signature": $signature,
                "url": $url
              }
            }
          }' > "$MANIFEST_FILE"

          echo "Generated $MANIFEST_FILE for version ${VERSION_TAG} (channel: ${CHANNEL}):"
          cat "$MANIFEST_FILE"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION_TAG#v}"

          gh release create "$VERSION_TAG" \
            --title "ModLEX App ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease="$([ "$CHANNEL" = "beta" ] && echo true || echo false)" \
            "${SETUP_EXE}#ModLEX.App_${VERSION}_x64-setup.exe" \
            "${SETUP_ZIP}#ModLEX.App_${VERSION}_x64-setup.nsis.zip"

      # updates.json / updates-beta.json are hosted on the separate site repo
      # (same one flags.json / news.json already live on), not in this repo.
      - name: Publish update manifest to site repo
        shell: bash
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${SITE_REPO_TOKEN}@github.com/GUSSIak/GUSSIak.github.io.git" site-repo
          cp "$MANIFEST_FILE" "site-repo/$MANIFEST_FILE"
          cd site-repo
          git config user.name "modlex-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MANIFEST_FILE"
          if git diff --cached --quiet; then
            echo "No manifest changes to publish"
          else
            git commit -m "Publish $MANIFEST_FILE for $VERSION_TAG"
            git push
          fi
